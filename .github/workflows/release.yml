# Push a tag like v0.1.0 to publish a GitHub release with two zips:
#   GuildSheet-<version>.zip         the addon (for WowUp "Install from URL" or manual install)
#   GuildSheet-Helper-<version>.zip  the sheet helper
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the .toc version
        run: |
          toc=$(grep -oP '^## Version: \K\S+' GuildSheet/GuildSheet.toc)
          if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match ## Version: $toc in GuildSheet.toc"; exit 1
          fi

      - name: Build zips
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir dist
          zip -r "dist/GuildSheet-$ver.zip" GuildSheet
          mkdir -p staging/GuildSheet-Helper
          cp helper/guildsheet_sync.py helper/config.example.json helper/requirements.txt helper/start_sync.bat README.md staging/GuildSheet-Helper/
          (cd staging && zip -r "../dist/GuildSheet-Helper-$ver.zip" GuildSheet-Helper)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "GuildSheet $GITHUB_REF_NAME" --generate-notes
